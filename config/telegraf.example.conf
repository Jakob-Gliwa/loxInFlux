# Choose the input matching [telegraf].protocol in config.toml.
[[inputs.socket_listener]]
  service_address = "udp://:8086"
  data_format = "influx"

# TCP alternative:
# [[inputs.socket_listener]]
#   service_address = "tcp://:8086"
#   data_format = "influx"

# MQTT alternative:
# [[inputs.mqtt_consumer]]
#   servers = ["tcp://mqtt:1883"]
#   topics = ["loxone/metrics"]
#   data_format = "influx"

# Execd alternative; all application diagnostics go to stderr:
# [[inputs.execd]]
#   command = ["/usr/local/bin/loxtotelegraf", "--config-dir", "/etc/loxtotelegraf"]
#   signal = "none"
#   data_format = "influx"

# Keep your existing output configuration here. For the first precision-correct
# run against InfluxDB, use a fresh bucket to avoid the old integer/string types.
