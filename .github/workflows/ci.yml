name: CI (Build, Test & Experimental)

# Validation plus the experimental channel:
#   * pull_request      -> test + multi-arch build ONLY (never pushes)
#   * push to main      -> test + build + push :experimental
#   * workflow_dispatch -> same as a push; on any other branch it pushes
#                          :experimental-<branch>, to try a branch before it lands
#
# Every image from here carries an :experimental prefix. The versioned tags and
# the moving :latest are published exclusively by release.yml, so a merge to main
# can never reach anyone who pulls :latest.

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ vars.DOCKER_USERNAME }}/loxinflux
  RUST_TOOLCHAIN: "1.99.0"
  CARGO_TERM_COLOR: always

jobs:
  # --- AUDIT STAGE ---
  # Against the advisory database as it is today, not as it was when the
  # lockfile last changed - so an advisory published against an unchanged tree
  # fails the next run. Accepted advisories live in .cargo/audit.toml.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit

  # --- TEST STAGE (native amd64, arm64 and macOS) ---
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup override set "$RUST_TOOLCHAIN"

      - name: Cache the cargo registry and target directory
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets

      # A release build catches what a debug one does not: the `strip` and
      # `lto` settings and the binary actually linking.
      - name: Build the release binary
        run: cargo build --locked --release

      - name: Load the unmodified 0.3 configuration template
        run: target/release/loxinflux --config-file tests/fixtures/legacy_config.toml --check-config

  # --- BUILD STAGE (one native runner per platform, no QEMU) ---
  build:
    needs: [audit, test]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare platform pair
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - name: Check out source
        uses: actions/checkout@v6

      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Only authenticate when we are actually going to push (not on PRs), so a
      # fork PR does not need the registry credentials at all.
      - name: Log in to Docker Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # PR: prove it compiles on this platform and never push.
      - name: Build image (PR validation, no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Build and push by digest (experimental)
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      # Start the image the way the README tells people to: config mounted at
      # /app/config, no arguments. The check only passes if the binary resolved
      # CONFIG_DIR from the image and accepted the unmodified 0.3 template.
      # `--load` is a cache hit against the build above, so this costs seconds.
      - name: Smoke-test the image
        run: |
          set -euo pipefail
          docker buildx build --platform "${{ matrix.platform }}" --load \
            -t loxinflux:smoke \
            --cache-from type=gha,scope=${{ env.PLATFORM_PAIR }} .

          version="$(docker run --rm loxinflux:smoke --version)"
          echo "$version"
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "$version" != "loxinflux $crate" ]; then
            echo "::error::image reports '$version', Cargo.toml says $crate" >&2
            exit 1
          fi

          # The 0.3 entrypoint ran `loxInFlux`; the alias must keep working.
          docker run --rm --entrypoint loxInFlux loxinflux:smoke --version

          mkdir -p smoke/config
          cp tests/fixtures/legacy_config.toml smoke/config/config.toml
          out="$(docker run --rm --network none \
            -v "$PWD/smoke/config:/app/config:ro" loxinflux:smoke --check-config 2>&1)"
          echo "$out"
          if ! grep -q 'Configuration valid: /app/config/config.toml' <<<"$out"; then
            echo "::error::the image did not validate the mounted configuration" >&2
            exit 1
          fi

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # --- MERGE STAGE (assemble the experimental multi-arch manifest) ---
  merge:
    needs: build
    # Skip entirely on PRs — nothing was pushed to merge.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE_NAME }}
          # latest=false: this workflow must never be able to move :latest, no
          # matter which branch or event it runs for. That tag belongs to
          # release.yml alone.
          flavor: |
            latest=false
          # A moving tag per branch (:experimental for main,
          # :experimental-<branch> for a dispatched branch) plus an immutable
          # :experimental-<short-sha> you can pin and roll back to.
          tags: |
            type=raw,value=experimental,enable={{is_default_branch}}
            type=ref,event=branch,prefix=experimental-,enable=${{ github.ref_name != github.event.repository.default_branch }}
            type=sha,prefix=experimental-,format=short

      - name: Log in to Docker Registry
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          mapfile -t TAG_ARGS < <(jq -r '.tags[] | "-t\n" + .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          mapfile -t ANN_ARGS < <(jq -r '.annotations[]? | "--annotation\n" + .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          if [ "${#TAG_ARGS[@]}" -eq 0 ]; then
            echo "No tags resolved. Nothing to push." >&2
            exit 1
          fi
          SOURCES=()
          for digest in *; do
            SOURCES+=("${IMAGE_NAME}@sha256:${digest}")
          done
          docker buildx imagetools create "${TAG_ARGS[@]}" "${ANN_ARGS[@]}" "${SOURCES[@]}"
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}

      - name: Inspect image
        run: |
          set -euo pipefail
          first_tag=$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools inspect "$first_tag"
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
