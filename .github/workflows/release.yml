name: Release (Publish to Docker Hub)

# The only workflow that publishes versioned tags and moves :latest. Triggered
# when a GitHub Release is published; the image tags are derived from the
# release's semver tag, e.g. "v0.5.0" -> 0.5.0, 0.5, latest.
#
# A prerelease tag such as "v0.5.0-rc1" publishes only its own immutable
# :0.5.0-rc1 and touches neither :latest nor :0.5 (see the merge stage).
#
# Everything on main lands on the :experimental channel via ci.yml instead.

on:
  release:
    types: [published]

# Never cancel a release run: a half-pushed manifest is worse than a slow queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ vars.DOCKER_USERNAME }}/loxinflux
  RUST_TOOLCHAIN: "1.99.0"
  CARGO_TERM_COLOR: always

jobs:
  # --- AUDIT STAGE (mirrors ci.yml) ---
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit

  # --- TEST STAGE (gate the release on green tests; mirrors ci.yml) ---
  # Only the platforms the image ships: a macOS runner queue must not be able to
  # stall a release while the GitHub Release is already public.
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup override set "$RUST_TOOLCHAIN"

      - name: Cache the cargo registry and target directory
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Build the release binary
        run: cargo build --locked --release

      - name: Load the unmodified 0.3 configuration template
        run: target/release/loxinflux --config-file tests/fixtures/legacy_config.toml --check-config

  # --- VERSION GATE (the git tag must match Cargo.toml) ---
  # The image tags come from the release's git tag via type=semver below. If
  # someone tags v0.5.1 but forgets to bump the crate, the image would advertise
  # 0.5.1 while the binary reports 0.5.0. Fail the release loudly instead.
  # Cargo.lock follows Cargo.toml; `--locked` in the test stage catches drift.
  version-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Assert the release tag matches Cargo.toml
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          tag="${RELEASE_TAG#v}"
          if [ "$crate" != "$tag" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match Cargo.toml version $crate" >&2
            exit 1
          fi
          echo "Release $RELEASE_TAG matches Cargo.toml version $crate"

  # --- BUILD STAGE (one native runner per platform, no QEMU) ---
  build:
    # Gate the published image on audit, tests AND version parity: a mismatch
    # must not be able to ship an image that misreports its own version.
    needs: [audit, test, version-check]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare platform pair
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - name: Check out source
        uses: actions/checkout@v6

      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Registry
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      # Same check as ci.yml. The digest is pushed but not yet tagged, so a
      # failure here leaves no reachable image behind.
      - name: Smoke-test the image
        run: |
          set -euo pipefail
          docker buildx build --platform "${{ matrix.platform }}" --load \
            -t loxinflux:smoke \
            --cache-from type=gha,scope=${{ env.PLATFORM_PAIR }} .

          version="$(docker run --rm loxinflux:smoke --version)"
          echo "$version"
          if [ "$version" != "loxinflux ${RELEASE_TAG#v}" ]; then
            echo "::error::image reports '$version', release is $RELEASE_TAG" >&2
            exit 1
          fi

          docker run --rm --entrypoint loxInFlux loxinflux:smoke --version

          mkdir -p smoke/config
          cp tests/fixtures/legacy_config.toml smoke/config/config.toml
          out="$(docker run --rm --network none \
            -v "$PWD/smoke/config:/app/config:ro" loxinflux:smoke --check-config 2>&1)"
          echo "$out"
          if ! grep -q 'Configuration valid: /app/config/config.toml' <<<"$out"; then
            echo "::error::the image did not validate the mounted configuration" >&2
            exit 1
          fi
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # --- MERGE STAGE (assemble the multi-arch manifest, tag & push) ---
  merge:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE_NAME }}
          # latest=auto (the default, stated so the contract is visible): the
          # moving :latest is emitted only for a stable semver. Together with
          # type=semver, which suppresses the :{{major}}.{{minor}} partial on a
          # prerelease, a tag like v0.5.0-rc1 publishes just its own immutable
          # :0.5.0-rc1 and clobbers neither :latest nor :0.5.
          flavor: |
            latest=auto
          # Derived from the release tag (refs/tags/<tag>). A stable tag like
          # "v0.5.0" yields 0.5.0, 0.5 and latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Log in to Docker Registry
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          mapfile -t TAG_ARGS < <(jq -r '.tags[] | "-t\n" + .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          mapfile -t ANN_ARGS < <(jq -r '.annotations[]? | "--annotation\n" + .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          if [ "${#TAG_ARGS[@]}" -eq 0 ]; then
            echo "No tags resolved. Nothing to push." >&2
            exit 1
          fi
          SOURCES=()
          for digest in *; do
            SOURCES+=("${IMAGE_NAME}@sha256:${digest}")
          done
          docker buildx imagetools create "${TAG_ARGS[@]}" "${ANN_ARGS[@]}" "${SOURCES[@]}"
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}

      - name: Inspect image
        run: |
          set -euo pipefail
          first_tag=$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools inspect "$first_tag"
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}

  # --- RETRACT ON FAILURE (best-effort un-publish) ---
  # A release:[published] trigger means the GitHub Release is already public
  # before any gate has run. If validation, the image build or the manifest push
  # fails, turn the release back into a draft so no broken or image-less release
  # is left visible. This narrows the public window but cannot close it - only
  # creating the release at the end of a tag-driven run would.
  retract-on-failure:
    needs: [audit, test, version-check, build, merge]
    # Run only when something upstream actually failed or was cancelled.
    if: >-
      always()
      && (contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Least privilege: only this job may write repo contents (edit the release).
    permissions:
      contents: write
    steps:
      - name: Convert release back to draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          echo "::warning::A release gate failed — retracting release '${RELEASE_TAG}' (id ${RELEASE_ID}) back to draft."
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=true
