version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "Jakob-Gliwa"
    assignees:
      - "Jakob-Gliwa"
    commit-message:
      prefix: "deps"
      include: "scope"
    # loxwebsocket is pinned exactly (=0.3.2) and is upgraded deliberately.
    ignore:
      - dependency-name: "loxwebsocket"
    groups:
      rust-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "09:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
