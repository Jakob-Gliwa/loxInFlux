[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loxInFlux"
version = "0.2.0"
description = "Loxone to InfluxDB Bridge"
authors = [
    { name = "Jakob Gliwa", email = "your.email@example.com" }
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pycryptodome>=3.23.0",
    "lxml>=6.1.1",
    "lz4>=4.4.5",
    "influxdb-client>=1.50.0",
    "aiofiles>=25.1.0",
    "orjson>=3.11.9",
    "uvloop>=0.22.1",
    "aiohttp>=3.14.2",
    "tomli>=2.4.1",
    "gmqtt>=0.7.0",
    "construct>=2.10.70",
    "loxwebsocket>=0.6.0",
    "pygixml>=0.12.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "setuptools>=83.0.0",
    "ruff>=0.15.20"
]

[project.scripts]
loxInFlux = "loxInFlux.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]   

[tool.uv]
system-certs = true

[tool.hatch.build.targets.wheel]
packages = ["src/loxInFlux"]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes (undefined names, unused imports/vars)
    "I",      # isort (import ordering)
    "B",      # flake8-bugbear (common bugs & anti-patterns)
    "ASYNC",  # flake8-async (asyncio pitfalls)
    "SIM",    # flake8-simplify
    "UP",     # pyupgrade
    "C4",     # flake8-comprehensions
]
ignore = [
    "E501",  # line length is handled by the formatter
]

[tool.ruff.lint.isort]
known-first-party = ["loxInFlux"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports are expected in package inits
# Micro-benchmarks deliberately read attributes without storing them to measure
# traversal cost, which B018 would otherwise flag as useless.
"benchmarks/*" = ["B018"]